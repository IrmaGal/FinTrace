[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingraph-ai-mpvi"
version = "0.1.0"
description = "Reproducible financial graph anomaly detection experiments on Elliptic++."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
gnn = ["torch>=2.3,<3", "torch-geometric>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]
